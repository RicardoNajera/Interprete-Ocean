<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#030F18" />
  <meta name="description" content="Intérprete Ocean Allure Costa Mujeres — Asistente de comunicación bidireccional para el equipo operativo del resort." />

  <title>Intérprete · Ocean Allure Costa Mujeres</title>

  <!-- Iconografía oficial -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon-app-180.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Tipografías: serif editorial + sans de interfaz -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-apple-180.png" />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body class="h-screen w-screen overflow-hidden antialiased selection:bg-[#0184B8]/35">
  <div id="app-root" class="w-full h-full relative flex justify-center">
    <!-- Contenedor móvil centrado en pantallas grandes -->
    <div id="mobile-container" class="w-full max-w-md h-full relative overflow-hidden flex flex-col"></div>
  </div>

  <!-- AVISO DE INSTALACIÓN · estilos autónomos, no dependen de Tailwind ni de la vista -->
  <style>
    .velo-instalar {
      position: fixed; inset: 0; z-index: 9999;
      display: none; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(circle at 50% 40%, rgba(5, 79, 124, 0.55), rgba(3, 15, 24, 0.9) 70%);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .velo-instalar.visible { display: flex; }
    .velo-instalar .caja {
      width: 100%; max-width: 320px; text-align: center; padding: 26px 22px 22px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(10, 42, 62, 0.98), rgba(4, 22, 34, 0.99));
      border: 1px solid rgba(79, 195, 232, 0.28);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: subirCaja 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes subirCaja {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .velo-instalar img.logo {
      width: 48px; height: 48px; margin: 0 auto 12px; display: block;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }
    .velo-instalar h2 {
      font-family: 'Cormorant Garamond', Didot, serif;
      font-size: 15px; font-weight: 400; letter-spacing: 0.16em;
      text-transform: uppercase; line-height: 1; color: #FBF9F5; margin: 0 0 6px;
    }
    .velo-instalar .sub {
      font-size: 7.5px; font-weight: 600; letter-spacing: 0.34em;
      text-transform: uppercase; color: rgba(79, 195, 232, 0.95);
      margin: 0 0 16px; padding-left: 0.34em;
    }
    .velo-instalar p.txt {
      font-size: 11.5px; line-height: 1.65; color: rgba(251, 249, 245, 0.72);
      margin: 0 0 20px; padding: 0 2px; font-weight: 400;
    }
    .velo-instalar p.txt strong { color: #FBF9F5; font-weight: 700; }
    .velo-instalar button.principal {
      width: 100%; padding: 13px 18px; border-radius: 12px; border: none;
      font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
      color: #03202E; cursor: pointer;
      background: linear-gradient(135deg, #4FC3E8 0%, #0184B8 100%);
      box-shadow: 0 8px 22px rgba(1, 132, 184, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      font-family: inherit;
    }
    .velo-instalar button.principal:active { transform: scale(0.975); }
    .velo-instalar button.secundario {
      margin-top: 12px; width: 100%; background: none; border: none;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(251, 249, 245, 0.45); cursor: pointer; padding: 6px; font-family: inherit;
    }
    .velo-instalar button.secundario:hover { color: rgba(251, 249, 245, 0.8); }
    [data-app-instalada="si"] .velo-instalar { display: none !important; }
  </style>

  <div id="velo-instalar" class="velo-instalar" data-instalar-app>
    <div class="caja">
      <img src="assets/logo-ocean-mark-white.svg" alt="" class="logo" />
      <h2>Ocean Allure</h2>
      <p class="sub">Costa Mujeres</p>
      <p class="txt">
        Instala el intérprete en tu dispositivo para abrirlo directo desde tu pantalla de inicio.
      </p>
      <button id="btn-instalar-app" class="principal" type="button">Instalar</button>
      <button id="btn-omitir-instalar" class="secundario" type="button">Ahora no</button>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
  <script>
    /* PWA: registro del service worker + control del aviso de instalación */
    (function () {
      // 1) Registro del service worker (habilita instalación y modo offline)
      if ('serviceWorker' in navigator) {
        var VERSION_APP = 'v5';           // ← súbelo en cada deploy
        var CLAVE_VERSION = 'ocean-version';

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
            // Busca siempre una versión nueva, ignorando la caché HTTP.
            reg.update();

            reg.addEventListener('updatefound', function () {
              var nuevo = reg.installing;
              if (!nuevo) return;
              nuevo.addEventListener('statechange', function () {
                if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
                  if (!sessionStorage.getItem('ocean-recarga-sw')) {
                    sessionStorage.setItem('ocean-recarga-sw', 'si');
                    location.reload();
                  }
                }
              });
            });
          }).catch(function () {});
        });

        // Cuando el SW nuevo toma el control, se borra todo lo viejo y se recarga.
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!sessionStorage.getItem('ocean-recarga-sw')) {
            sessionStorage.setItem('ocean-recarga-sw', 'si');
            location.reload();
          }
        });

        // ¿Cambió la versión desplegada? Se limpia caché y se fuerza la nueva.
        if (localStorage.getItem(CLAVE_VERSION) !== VERSION_APP) {
          localStorage.setItem(CLAVE_VERSION, VERSION_APP);
          Promise.resolve()
            .then(function () { return caches.keys(); })
            .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
            .then(function () {
              return navigator.serviceWorker.getRegistrations();
            })
            .then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
            .then(function () {
              // Recarga una sola vez para estrenar todo limpio.
              if (!sessionStorage.getItem('ocean-limpieza-' + VERSION_APP)) {
                sessionStorage.setItem('ocean-limpieza-' + VERSION_APP, 'si');
                location.reload();
              }
            })
            .catch(function () {});
        }
      }

      // 2) Si la app YA corre instalada (standalone), se marca y no se muestra nada.
      var yaInstalada =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.matchMedia('(display-mode: minimal-ui)').matches ||
        window.navigator.standalone === true;

      function marcarInstalada() {
        document.documentElement.setAttribute('data-app-instalada', 'si');
        document.querySelectorAll('[data-instalar-app]').forEach(function (el) {
          el.style.display = 'none';
          el.setAttribute('hidden', '');
          el.remove();
        });
      }

      if (yaInstalada) marcarInstalada();

      // 3) Una vez instalada (o al cambiar a standalone), se retira el botón para siempre.
      window.matchMedia('(display-mode: standalone)').addEventListener('change', function (ev) {
        if (ev.matches) marcarInstalada();
      });

      // 4) Recordar la instalación: tras instalarse, no se vuelve a ofrecer.
      if (localStorage.getItem('ocean-app-instalada') === 'si') marcarInstalada();

      window.addEventListener('appinstalled', function () {
        try { localStorage.setItem('ocean-app-instalada', 'si'); } catch (e) {}
        marcarInstalada();
      });

      // 5) Expón para que el botón se oculte solo cuando el evento de instalación se consume.
      window.__marcarAppInstalada = function () {
        try { localStorage.setItem('ocean-app-instalada', 'si'); } catch (e) {}
        marcarInstalada();
      };
    })();

      // 6) Aviso central de instalación: aparece solo la primera vez.
      var promptDiferido = null;

      function mostrarVeloInstalar() {
        var velo = document.getElementById('velo-instalar');
        if (!velo || document.documentElement.getAttribute('data-app-instalada') === 'si') return;
        if (localStorage.getItem('ocean-instalar-omitido') === 'si') return;
        velo.classList.add('visible');
      }

      function cerrarVeloInstalar() {
        var velo = document.getElementById('velo-instalar');
        if (velo) velo.classList.remove('visible');
      }

      window.addEventListener('beforeinstallprompt', function (ev) {
        ev.preventDefault();
        promptDiferido = ev;
        mostrarVeloInstalar();
      });

      document.addEventListener('click', function (ev) {
        if (!ev.target.closest) return;
        var btn = ev.target.closest('#btn-instalar-app');
        var omitir = ev.target.closest('#btn-omitir-instalar');

        if (btn) {
          if (promptDiferido) {
            promptDiferido.prompt();
            promptDiferido.userChoice.then(function (res) {
              if (res && res.outcome === 'accepted') {
                window.__marcarAppInstalada();
              } else {
                try { localStorage.setItem('ocean-instalar-omitido', 'si'); } catch (e) {}
              }
              promptDiferido = null;
              cerrarVeloInstalar();
            }).catch(function () { cerrarVeloInstalar(); });
          } else {
            // Navegadores sin beforeinstallprompt (iOS/Safari): instrucciones.
            var tarjeta = document.querySelector('#velo-instalar .caja');
            if (tarjeta) {
              tarjeta.innerHTML =
                '<img src="assets/logo-ocean-mark-white.svg" alt="" class="logo" />' +
                '<h2>Instalar</h2>' +
                '<p class="txt">' +
                  'En iPhone/iPad: toca <strong>Compartir</strong> y elige <strong>Añadir a pantalla de inicio</strong>.<br><br>' +
                  'En Android/Chrome: abre el menú <strong>⋮</strong> y elige <strong>Instalar aplicación</strong>.' +
                '</p>' +
                '<button id="btn-omitir-instalar" class="secundario" type="button" style="margin-top:0">Entendido</button>';
            }
          }
        }

        if (omitir) {
          try { localStorage.setItem('ocean-instalar-omitido', 'si'); } catch (e) {}
          cerrarVeloInstalar();
        }
      });

      // 7) Respaldo: si el navegador no dispara beforeinstallprompt (iOS), se ofrece igual.
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (promptDiferido) return; // ya hay prompt nativo disponible
          mostrarVeloInstalar();
        }, 1200);
      });

      // 8) FORZAR ACTUALIZACIÓN: toca el logo 5 veces seguidas.
      //    Borra caché + service worker y recarga limpio. Sin salir del navegador.
      var toquesLogo = 0;
      var temporizadorLogo = null;

      window.forzarActualizacion = function () {
        try {
          sessionStorage.clear();
          localStorage.removeItem('ocean-version');
          localStorage.removeItem('ocean-instalar-omitido');
        } catch (e) {}

        var aviso = document.createElement('div');
        aviso.textContent = 'Actualizando…';
        aviso.style.cssText =
          'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;' +
          'background:rgba(3,15,24,0.96);color:#4FC3E8;font:700 13px/1 Inter,sans-serif;' +
          'letter-spacing:0.2em;text-transform:uppercase;';
        document.body.appendChild(aviso);

        Promise.resolve()
          .then(function () { return window.caches ? caches.keys() : []; })
          .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
          .then(function () {
            return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : [];
          })
          .then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          })
          .then(function () {
            // Recarga con parámetro único: salta toda caché del navegador.
            var base = location.origin + location.pathname;
            location.replace(base + '?v=' + Date.now());
          })
          .catch(function () {
            location.replace(location.origin + location.pathname + '?v=' + Date.now());
          });
      };

      document.addEventListener('click', function (ev) {
        if (!ev.target.closest) return;
        // Se activa tocando el logo de la cabecera (o el del aviso de instalación).
        if (!ev.target.closest('header img') && !ev.target.closest('#velo-instalar img')) return;

        toquesLogo++;
        clearTimeout(temporizadorLogo);
        temporizadorLogo = setTimeout(function () { toquesLogo = 0; }, 2000);

        if (toquesLogo >= 5) {
          toquesLogo = 0;
          window.forzarActualizacion();
        }
      });

  </script>
</body>
</html>
